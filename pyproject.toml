[project]
name = "data-agent"
version = "0.1.0"
description = "智能数据分析 Agent 平台：Text-to-SQL + RAG + Skills 插件化 + MCP"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # LLM / Agent（LangChain v1，middleware 需要）
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    # MCP
    "langchain-mcp-adapters>=0.1.11",
    # SQL 解析与校验
    "sqlglot>=25",
    # RAG / 检索
    "pymilvus>=2.4",
    "langchain-text-splitters>=0.3",
    "rank-bm25>=0.2.2",
    "jieba>=0.42",
    # 知识图谱（轻量版：SQLite 三元组表 + 内存图查询）
    "networkx>=3",
    # 持久化（SQLAlchemy 2.0 async；SQLite 起步、PG 就绪）
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    # 存储 / 工具
    "redis>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "loguru>=0.7",
    # 调用链追踪（可选）
    "langfuse>=2",
    # 异步任务（ARQ + Redis 事件流）
    "arq>=0.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2",
    "ruff>=0.6",
]

# 本地 BGE 重排/向量（重依赖，按需安装）：uv pip install torch FlagEmbedding

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 启用基础规则集：错误(F)、pycodestyle(E/W)、import 排序(I)、
# bugbear(B)、简化(SIM)、现代类型注记(UP)。
select = ["E", "W", "F", "I", "B", "SIM", "UP"]
ignore = [
    "B008",     # 函数默认参数调函数：FastAPI Depends() 的标准模式，非 bug
    "BLE001",   # 裸 except Exception：工具熔断降级有意为之
    "UP006",    # typing.List → list：纯风格现代化，不阻塞（迁移时再统一）
    "UP007",    # typing.Optional → X | None：同上
    "UP035",    # from typing import List 已弃用：同上
    "UP042",    # typing.Optional → X | None：同上
    "UP045",    # typing.Optional → X | None：同上
    "UP037",    # 引号注记：同上
    "UP041",    # typing.Tuple → tuple：同上
    "B904",     # raise from err：链式异常有价值，44 处待专项清理，暂不阻塞
    "B905",     # zip() 缺 strict=：待专项评估，暂不阻塞
    "SIM102",   # 嵌套 if 可合并：可读性见仁见智
    "SIM108",   # if/else 可改三元：可读性见仁见智
    "E402",     # import 不在顶部：部分文件有意先设 sys 路径
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]   # 测试里长行可接受
