[project]
name = "data-agent"
version = "0.1.0"
description = "智能数据分析 Agent 平台：Text-to-SQL + RAG + Skills 插件化 + MCP"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # LLM / Agent（LangChain v1，middleware 需要）
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    # MCP
    "langchain-mcp-adapters>=0.1.11",
    # RAG / 检索
    "pymilvus>=2.4",
    "langchain-text-splitters>=0.3",
    "rank-bm25>=0.2.2",
    "jieba>=0.42",
    # 存储 / 工具
    "redis>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# 本地 BGE 重排/向量（重依赖，按需安装）：uv pip install torch FlagEmbedding

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
